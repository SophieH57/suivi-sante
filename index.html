<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suivi santé</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#2a7a8c">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🩺 Suivi santé</h1></header>

<main>
  <section id="v-day" class="view"></section>
  <section id="v-month" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
</main>

<nav>
  <button data-view="day" class="on">📝<span>Journée</span></button>
  <button data-view="month">📅<span>Calendrier</span></button>
  <button data-view="settings">⚙️<span>Réglages</span></button>
</nav>

<div id="toast" hidden></div>

<!-- Fenêtre générique : le contenu du formulaire est écrit par app.js (openDlg) -->
<dialog id="dlg"><form method="dialog" id="dform"></form></dialog>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
